<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.berthaPushReady = false;
window.berthaOneSignalInitError = '';
window.berthaOneSignalOptInError = '';
window.berthaPushChangeTrace = '';
window.berthaWithTimeout = function(promise, ms, label){
  return Promise.race([promise, new Promise((_,reject)=>setTimeout(()=>reject(new Error((label||'operação')+' TIMEOUT após '+ms+'ms')),ms))]);
};
window.berthaGetPushSubscriptionId = async function(){
  return new Promise((resolve)=>{
    window.OneSignalDeferred.push(async function(OneSignal){
      let settled = false;
      let timer = null;
      const finish = (id)=>{
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        try { OneSignal.User.PushSubscription.removeEventListener('change', onChange); } catch (_) {}
        resolve(id || null);
      };
      const onChange = (event)=>{
        const id = event?.current?.id || OneSignal.User.PushSubscription.id || null;
        if (id) finish(id);
      };
      try {
        const existingId = OneSignal.User.PushSubscription.id || null;
        if (existingId) { finish(existingId); return; }
        OneSignal.User.PushSubscription.addEventListener('change', onChange);
        if (OneSignal.Notifications.permission && !OneSignal.User.PushSubscription.token) {
          try {
            await window.berthaWithTimeout(OneSignal.User.PushSubscription.optIn(), 4000, 'optIn');
          } catch (error) {
            window.berthaOneSignalOptInError = (error?.name || 'Error') + ': ' + (error?.message || String(error));
            console.warn('BERTH.A OneSignal optIn', error);
          }
        }
        const afterOptInId = OneSignal.User.PushSubscription.id || null;
        if (afterOptInId) { finish(afterOptInId); return; }
        timer = setTimeout(()=>finish(OneSignal.User.PushSubscription.id || null), 10000);
      } catch (error) {
        console.warn('BERTH.A push subscription', error);
        finish(null);
      }
    });
  });
};
window.berthaRequestPushPermission = async function(){
  return new Promise((resolve)=>{
    window.OneSignalDeferred.push(async function(OneSignal){
      try {
        if (!OneSignal.Notifications.isPushSupported()) { resolve({ok:false,reason:'unsupported'}); return; }
        await OneSignal.Notifications.requestPermission();
        if (OneSignal.Notifications.permission) {
          try {
            await window.berthaWithTimeout(OneSignal.User.PushSubscription.optIn(), 4000, 'optIn');
          } catch (error) {
            window.berthaOneSignalOptInError = (error?.name || 'Error') + ': ' + (error?.message || String(error));
            throw error;
          }
        }
        const ok = !!OneSignal.Notifications.permission && !!OneSignal.User.PushSubscription.optedIn;
        window.berthaPushReady = ok;
        const subscriptionId = ok ? await window.berthaGetPushSubscriptionId() : null;
        resolve({ok:ok && !!subscriptionId, subscriptionId});
      } catch (error) {
        console.warn('BERTH.A push permission', error);
        resolve({ok:false,reason:'error'});
      }
    });
  });
};
window.BERTHA_PUSH_BACKEND = 'https://ouxellokvigbdeeyvvfv.supabase.co/functions/v1/bertha-push';
window.berthaSchedulePush = async function(item){
  const subscriptionId = await window.berthaGetPushSubscriptionId();
  if (!subscriptionId) return {ok:false,message:'Não foi possível ativar o aviso. Verifique se as notificações do BERTH.A estão permitidas no iPhone.'};
  const localDate=()=>{const n=new Date(),p=v=>String(v).padStart(2,'0');return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;};
  const date=item.dueDate||localDate();
  const offset=String(item.notifyOffset||'at-time');
  let notifyTime='';
  if(offset==='custom-time') notifyTime=item.notifyTime||'';
  else if(offset==='period-start') notifyTime=({morning:'05:16',afternoon:'12:00',night:'18:00',evening:'18:00'})[item.period]||'';
  else notifyTime=item.time||'';
  if(!notifyTime) return {ok:false,message:'A tarefa foi salva, mas falta definir um horário para o aviso.'};
  const [h,m]=notifyTime.split(':').map(Number),[y,mo,d]=date.split('-').map(Number);
  if(![y,mo,d,h,m].every(Number.isFinite)) return {ok:false,message:'A tarefa foi salva, mas a data ou o horário do aviso não é válido.'};
  const when=new Date(y,mo-1,d,h,m,0,0);
  if(/^(10|30|60)$/.test(offset)) when.setMinutes(when.getMinutes()-Number(offset));
  if(when.getTime()<=Date.now()+15000) return {ok:false,message:'A tarefa foi salva, mas o horário escolhido para o aviso já passou.'};
  try{
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);let response;
    try{response=await fetch(window.BERTHA_PUSH_BACKEND,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,body:JSON.stringify({title:'BERTH.A',message:item.title||item.name||'Você tem uma tarefa agora.',subscriptionId,sendAfter:when.toISOString()})});}
    finally{clearTimeout(timer);}
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data?.ok) return {ok:false,message:'A tarefa foi salva, mas o aviso não pôde ser agendado agora.'};
    return {ok:true,notificationId:data.notificationId||'',scheduledFor:when.toISOString()};
  }catch(error){console.warn('BERTH.A schedule push',error);return {ok:false,message:'A tarefa foi salva, mas o aviso não pôde ser agendado agora.'};}
};

window.OneSignalDeferred.push(async function(OneSignal){
  try {
    await OneSignal.init({
      appId: "18d49ac6-cdad-4780-8437-cbdcd025a680",
      serviceWorkerPath: "It-s-my-life-/sw.js",
      serviceWorkerParam: { scope: "/It-s-my-life-/" },
      autoResubscribe: true,
      welcomeNotification: { disable: true }
    });
    try {
      OneSignal.User.PushSubscription.addEventListener('change', function(event){
        const c = event?.current || {};
        window.berthaPushChangeTrace = 'id=' + (c.id || '—') + ', token=' + (c.token ? 'sim' : 'não') + ', optedIn=' + (c.optedIn ? 'sim' : 'não');
      });
    } catch (_) {}
    window.berthaPushReady = !!OneSignal.Notifications.permission && !!OneSignal.User.PushSubscription.optedIn;
  } catch (error) {
    window.berthaOneSignalInitError = (error?.name || 'Error') + ': ' + (error?.message || String(error));
    console.warn('BERTH.A OneSignal init', error);
  }
});
</script>
