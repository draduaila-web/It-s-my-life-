<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.berthaPushReady = false;
window.berthaGetPushSubscriptionId = async function(){
  return new Promise((resolve)=>{
    window.OneSignalDeferred.push(async function(OneSignal){
      let settled = false;
      let timer = null;
      const finish = (id)=>{
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        try { OneSignal.User.PushSubscription.removeEventListener('change', onChange); } catch (_) {}
        resolve(id || null);
      };
      const onChange = (event)=>{
        const id = event?.current?.id || OneSignal.User.PushSubscription.id || null;
        if (id) finish(id);
      };
      try {
        const existingId = OneSignal.User.PushSubscription.id || null;
        if (existingId) { finish(existingId); return; }
        OneSignal.User.PushSubscription.addEventListener('change', onChange);
        if (OneSignal.Notifications.permission && !OneSignal.User.PushSubscription.optedIn) {
          await OneSignal.User.PushSubscription.optIn();
        }
        const afterOptInId = OneSignal.User.PushSubscription.id || null;
        if (afterOptInId) { finish(afterOptInId); return; }
        timer = setTimeout(()=>finish(OneSignal.User.PushSubscription.id || null), 10000);
      } catch (error) {
        console.warn('BERTH.A push subscription', error);
        finish(null);
      }
    });
  });
};
window.berthaRequestPushPermission = async function(){
  return new Promise((resolve)=>{
    window.OneSignalDeferred.push(async function(OneSignal){
      try {
        if (!OneSignal.Notifications.isPushSupported()) { resolve({ok:false,reason:'unsupported'}); return; }
        await OneSignal.Notifications.requestPermission();
        if (OneSignal.Notifications.permission) await OneSignal.User.PushSubscription.optIn();
        const ok = !!OneSignal.Notifications.permission && !!OneSignal.User.PushSubscription.optedIn;
        window.berthaPushReady = ok;
        const subscriptionId = ok ? await window.berthaGetPushSubscriptionId() : null;
        resolve({ok:ok && !!subscriptionId, subscriptionId});
      } catch (error) {
        console.warn('BERTH.A push permission', error);
        resolve({ok:false,reason:'error'});
      }
    });
  });
};
window.BERTHA_PUSH_BACKEND = 'https://berth-a-push-backend-xgqhse.v2.appdeploy.ai';
window.berthaSchedulePush = async function(item){
  const subscriptionId = await window.berthaGetPushSubscriptionId();
  if (!subscriptionId) {
    let swState = 'não registrado';
    let nativePush = 'não verificada';
    let osToken = 'ausente';
    let osOptedIn = 'não';
    try {
      const reg = await navigator.serviceWorker.getRegistration('/It-s-my-life-/push/onesignal/');
      if (reg) {
        swState = reg.active ? 'ativo' : (reg.installing ? 'instalando' : (reg.waiting ? 'aguardando' : 'registrado'));
        try { nativePush = (await reg.pushManager.getSubscription()) ? 'criada' : 'ausente'; } catch (_) { nativePush = 'erro'; }
      }
    } catch (_) {}
    try {
      await new Promise((done)=>window.OneSignalDeferred.push(function(OneSignal){
        try {
          osToken = OneSignal.User.PushSubscription.token ? 'presente' : 'ausente';
          osOptedIn = OneSignal.User.PushSubscription.optedIn ? 'sim' : 'não';
        } catch (_) {}
        done();
      }));
    } catch (_) {}
    return {ok:false,message:'Diagnóstico v81 — Service Worker: ' + swState + '; assinatura nativa: ' + nativePush + '; token OneSignal: ' + osToken + '; optedIn: ' + osOptedIn + '; Subscription ID: ausente. Envie este aviso.'};
  }
  const date = item.dueDate || new Date().toISOString().slice(0,10);
  let notifyTime = item.notifyTime || '';
  if (item.notifyOffset === 'period-start') notifyTime = ({morning:'05:16',afternoon:'12:00',night:'18:00',evening:'18:00'})[item.period] || '';
  if (!notifyTime) notifyTime = item.time || '';
  if (!notifyTime) return {ok:false,message:'Defina um horário para a tarefa ou para o aviso.'};
  const [h,m] = notifyTime.split(':').map(Number);
  const [y,mo,d] = date.split('-').map(Number);
  const when = new Date(y,mo-1,d,h,m,0,0);
  if (/^(10|30|60)$/.test(String(item.notifyOffset))) when.setMinutes(when.getMinutes()-Number(item.notifyOffset));
  if (when.getTime() <= Date.now()+15000) return {ok:false,message:'O horário do aviso precisa estar no futuro.'};
  const response = await fetch(window.BERTHA_PUSH_BACKEND + '/api/push', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:'BERTH.A',message:item.title || item.name || 'Você tem uma tarefa agora.',subscriptionId,sendAfter:when.toISOString(),url:'https://draduaila-web.github.io/It-s-my-life/'})
  });
  const data = await response.json().catch(()=>({}));
  if(!response.ok) return {ok:false,message:data?.error || 'A tarefa foi salva, mas o servidor não aceitou o agendamento.'};
  return {ok:!!data.ok, data};
};
window.OneSignalDeferred.push(async function(OneSignal){
  try {
    await OneSignal.init({
      appId: "18d49ac6-cdad-4780-8437-cbdcd025a680",
      serviceWorkerPath: "It-s-my-life-/push/onesignal/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/It-s-my-life-/push/onesignal/" },
      autoResubscribe: true,
      welcomeNotification: { disable: true }
    });
    window.berthaPushReady = !!OneSignal.Notifications.permission && !!OneSignal.User.PushSubscription.optedIn;
  } catch (error) { console.warn('BERTH.A OneSignal init', error); }
});
</script>
