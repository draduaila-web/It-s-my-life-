<!doctype html><meta charset="utf-8"><title>QA duas abas — dados fictícios</title><h1>Cliente RC393 em duas abas</h1><p>Transporte simulado; localStorage real de origem isolada. Nenhuma chamada externa.</p><button id="seed">Preparar sessão fictícia expirada</button><button id="start">Iniciar consulta</button><button id="ok">Entregar renovação bem-sucedida</button><button id="fail">Entregar erro 400 tardio</button><button id="inspect">Conferir armazenamento</button><button id="locks">Inspecionar locks nativos</button><button id="offline">Sair sem rede</button><button id="resume">Retomar saída online</button><button id="status">Estado seguro</button><pre id="out"></pre><script src="../helper-client-rc393.js"></script><script>
const out=document.getElementById('out'),sk='qa-only-r3-synthetic-session',fresh=()=>({access_token:'fake-access',refresh_token:'fake-new',expires_at:Math.floor(Date.now()/1000)+3600,user:{id:'fake-user'}});let pending=null,offline=false;let history=[];window.addEventListener('storage',e=>{if(e.key===sk)history.push({event:'storage',at:performance.now(),fresh:JSON.parse(e.newValue||'null')?.expires_at> Date.now()/1000});});
const response=(x,status=200)=>({ok:status<400,status,text:async()=>JSON.stringify(x)});
const client=BerthaHelper.createClient({storage:localStorage,sessionKey:sk,key:'fake-key',base:'https://example.invalid',fetch:async url=>{if(offline)throw Error('offline');return url.includes('grant_type=password')?response({...fresh(),expires_at:1,refresh_token:'fake-old'}):url.includes('grant_type=refresh_token')?new Promise(r=>{pending=r;history.push({event:'refresh',at:performance.now(),fresh:JSON.parse(localStorage.getItem(sk)||'null')?.expires_at>Date.now()/1000});out.textContent='Renovação pendente nesta aba';}):response({id:'fake-user'});}});
document.getElementById('locks').onclick=async()=>{out.textContent=JSON.stringify({locks:await navigator.locks.query(),history});};
document.getElementById('offline').onclick=async()=>{offline=true;try{const r=await client.signOut();out.textContent='Sessão: '+!!client.session()+'; pendências: '+r.pending;}catch(e){out.textContent=e.message;}};
document.getElementById('resume').onclick=async()=>{offline=false;try{const r=await client.resumeLogout();out.textContent='Sessão: '+!!client.session()+'; pendências: '+r.pending;}catch(e){out.textContent=e.message;}};
document.getElementById('status').onclick=()=>out.textContent='Sessão: '+!!client.session()+'; pendências: '+client.logoutStatus().pending;
document.getElementById('seed').onclick=async()=>{try{await client.signIn('synthetic@example.invalid','synthetic');out.textContent='Sessão fictícia expirada preparada';}catch(e){out.textContent=e.message;}};
document.getElementById('start').onclick=()=>client.user().then(()=>out.textContent='Consulta concluída; sessão renovada').catch(e=>out.textContent='Consulta rejeitada: '+e.message);
document.getElementById('ok').onclick=()=>{if(pending){pending(response(fresh()));pending=null;}};
document.getElementById('fail').onclick=()=>{if(pending){pending(response({message:'old refresh rejected'},400));pending=null;}};
document.getElementById('inspect').onclick=()=>out.textContent=localStorage.getItem(sk)?'Sessão presente: '+JSON.parse(localStorage.getItem(sk)).refresh_token:'Sessão ausente';
</script>
