<!doctype html><meta charset="utf-8"><title>BERTH.A R4 — recuperação local</title><h1>Recuperação R4</h1><p>localStorage e IndexedDB nativos; conta e transporte fictícios; sem rede externa.</p><button id="login">Entrar com conta fictícia</button><button id="before">Interromper antes de gravar sessão</button><button id="after">Interromper depois de gravar sessão</button><button id="query">Conferir acesso</button><button id="state">Conferir estado sem credenciais</button><pre id="result"></pre><script src="../helper-client-rc393.js"></script><script>
const sk='qa-r4-interruption',scope='https://example.invalid:'+sk,out=document.getElementById('result');let fault='',network=0;
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('bertha-auth-coherence-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('states');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function record(value,write){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('states',write?'readwrite':'readonly'),r=write?t.objectStore('states').put(value,scope):t.objectStore('states').get(scope);let v;r.onsuccess=()=>v=r.result;t.oncomplete=()=>{d.close();resolve(v);};t.onabort=t.onerror=()=>{d.close();reject(Error('fixture database'));};});}
const storage={coherenceStorage:localStorage,getItem:k=>localStorage.getItem(k),removeItem:k=>localStorage.removeItem(k),setItem:(k,v)=>{if(k===sk&&fault==='before'){fault='';throw Error('Interrupção simulada antes da sessão');}localStorage.setItem(k,v);}};
const journal={read:()=>record(null,false),write:(k,v)=>{if(fault==='after'&&typeof v==='string'){fault='';throw Error('Interrupção simulada depois da sessão');}return record(v,true);}};
const client=BerthaHelper.createClient({storage,coherenceJournal:journal,base:'https://example.invalid',sessionKey:sk,key:'synthetic',fetch:async url=>{network++;const result=url.includes('grant_type=password')?{access_token:'synthetic-r4-access',refresh_token:'synthetic-r4-refresh',user:{id:'synthetic-r4-user'},expires_at:Math.floor(Date.now()/1000)+3600}:{id:'synthetic-r4-user'};return {ok:true,status:200,text:async()=>JSON.stringify(result)};}});
async function login(){try{await client.signIn('synthetic@example.invalid','synthetic');out.textContent='Novo acesso confirmado';}catch(e){out.textContent=e.code||e.message;}}
document.getElementById('login').onclick=login;document.getElementById('before').onclick=()=>{fault='before';login();};document.getElementById('after').onclick=()=>{fault='after';login();};document.getElementById('query').onclick=async()=>{try{await client.user();out.textContent='Acesso conferido';}catch(e){out.textContent=e.code||e.message;}};document.getElementById('state').onclick=async()=>{const r=await record(null,false);out.textContent=JSON.stringify({sessionVisible:!!client.session(),pendingLogout:client.logoutStatus().pending,checkpoint:!!r?.pending,network});};
</script>
