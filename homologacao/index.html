<script id="bertha-rollback-221-bootstrap">
(function(){
  const KEY='bertha.hml.rc13.modalcolors.refresh';
  async function hardReset(){
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('hml-bertha-')).map(k=>caches.delete(k)));
      }
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      sessionStorage.setItem(KEY,'1');
      const u=new URL(location.href);
      if(u.searchParams.get('rollback')!=='221'){
        u.searchParams.set('rollback','221');
        location.replace(u.toString());
      }
    }catch(e){ console.warn('[BERTH.A rollback 221]',e); }
  }
  if(sessionStorage.getItem(KEY)!=='1') hardReset();
})();
</script>

<script>
(function(){
  const PREFIX='bertha-hml::';
  const raw=window.localStorage;
  const keys=()=>{const a=[];for(let i=0;i<raw.length;i++){const k=raw.key(i);if(k&&k.startsWith(PREFIX))a.push(k.slice(PREFIX.length));}return a;};
  window.berthaHmlStorage={
    getItem:key=>raw.getItem(PREFIX+key),
    setItem:(key,value)=>raw.setItem(PREFIX+key,String(value)),
    removeItem:key=>raw.removeItem(PREFIX+key),
    clear:()=>keys().forEach(k=>raw.removeItem(PREFIX+k)),
    key:i=>keys()[i]??null,
    get length(){return keys().length},
    entries:()=>{const out={};keys().forEach(k=>out[k]=raw.getItem(PREFIX+k));return out;}
  };
  // v2.8.177 — trava de isolamento: toda leitura/escrita funcional da HML passa pelo namespace acima.
  // A sentinela confirma no carregamento que o wrapper não escreve na chave bruta usada pela produção.
  try{
    const sentinel='__bertha_hml_isolation__';
    window.berthaHmlStorage.setItem(sentinel,'ok');
    if(raw.getItem(sentinel)!==null) throw new Error('Falha no isolamento do armazenamento');
    window.berthaHmlStorage.removeItem(sentinel);
    window.__BERTHA_HML_STORAGE_ISOLATED__=true;
  }catch(e){
    window.__BERTHA_HML_STORAGE_ISOLATED__=false;
    console.error('[BERTH.A HML] armazenamento não isolado',e);
  }
  // Push real fica neutralizado na homologação. O fluxo interno pode ser testado sem disparar notificações.
  window.berthaPushReady=true;
  window.berthaRequestPushPermission=async()=>({ok:true,homologacao:true});
  window.berthaGetPushSubscriptionId=async()=> 'HOMOLOGACAO';
  window.berthaSchedulePush=async(item)=>({ok:true,homologacao:true,notificationId:'HML-NO-PUSH',scheduledFor:null});
  // Homologação: valida a regra e o estado, mas não envia push real.
  window.berthaScheduleBillReminder=async(bill)=>({ok:true,homologacao:true,billId:bill?.id||'',firstTime:bill?.reminderTime||'09:00',repeatTime:bill?.repeatIfPending===false?'':(bill?.repeatReminderTime||'21:30')});
  window.berthaResolveBillReminder=async(info)=>({ok:true,homologacao:true,resolved:true,billId:info?.billId||''});
})();
</script>

.bertha-data-tools{margin-top:14px;padding-top:14px;border-top:1px solid rgba(112,96,104,.10);display:grid;grid-template-columns:1fr 1fr;gap:8px}.bertha-data-title{grid-column:1/-1;font-size:10px;letter-spacing:.16em;font-weight:800;color:#9b8d95;margin:0 2px 2px}.bertha-data-tools button{appearance:none;border:1px solid rgba(126,104,116,.10);border-radius:15px;background:#fffaf3;color:#625862;padding:11px 10px;font:inherit;font-size:12px;font-weight:750}.bertha-data-tools button:first-of-type{background:linear-gradient(135deg,rgba(250,218,203,.72),rgba(245,197,180,.66));color:#7d5448}
</style>
<script>
(function(){
  const APP_PREFIXES=['bertha.','minha-vida.'];
  const isAppKey=k=>APP_PREFIXES.some(p=>String(k).startsWith(p));
  function collect(){const all=window.berthaHmlStorage.entries(),data={};Object.keys(all).filter(isAppKey).forEach(k=>data[k]=all[k]);return data;}
  function exportBackup(){
    const payload={format:'BERTHA_BACKUP',version:1,createdAt:new Date().toISOString(),environment:'HOMOLOGACAO',appVersion:'2.8.217-hml',data:collect()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    const d=new Date(),pad=n=>String(n).padStart(2,'0');a.href=url;a.download=`BERTHA_HOMOLOGACAO_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  async function importBackup(file){
    let payload;try{payload=JSON.parse(await file.text())}catch{alert('Este arquivo não é um backup BERTH.A válido.');return;}
    if(!payload||payload.format!=='BERTHA_BACKUP'||!payload.data||typeof payload.data!=='object'){alert('Este arquivo não é um backup BERTH.A válido.');return;}
    const keys=Object.keys(payload.data).filter(isAppKey);if(!keys.length){alert('O backup não contém dados BERTH.A.');return;}
    if(!confirm(`Carregar ${keys.length} conjuntos de dados na HOMOLOGAÇÃO? A BERTH.A de produção não será alterada.`))return;
    window.berthaHmlStorage.clear();keys.forEach(k=>window.berthaHmlStorage.setItem(k,String(payload.data[k])));alert('Backup carregado somente na homologação.');location.reload();
  }
  function resetHomologacao(){if(!confirm('Apagar somente os dados de teste da homologação? A produção não será alterada.'))return;window.berthaHmlStorage.clear();alert('Homologação limpa.');location.reload();}
  window.__berthaExportBackup=exportBackup;
  window.__berthaImportBackup=importBackup;
  window.__berthaResetHomologacao=resetHomologacao;
  document.addEventListener('DOMContentLoaded',()=>{
    const ex=document.getElementById('berthaBackupExport'),im=document.getElementById('berthaBackupImport'),fi=document.getElementById('berthaBackupFile');
    if(ex)ex.onclick=exportBackup;if(im&&fi)im.onclick=()=>fi.click();if(fi)fi.onchange=()=>{const f=fi.files&&fi.files[0];if(f)importBackup(f);fi.value='';};
  });
})();
</script>
